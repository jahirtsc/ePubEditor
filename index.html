<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ePub Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Segoe UI"', 'SegoeUI', '-apple-system', 'BlinkMacSystemFont', 'Roboto', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="bg-[#f3f2f1] text-slate-800 min-h-screen font-sans pb-24 antialiased selection:bg-[#0067b8]/20 selection:text-[#0067b8]">

  <!-- Header Superior Estilo Microsoft / Fluent UI -->
  <header class="border-b border-slate-200 bg-white sticky top-0 z-40 px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <!-- Icono de Libro Microsoft Fluent -->
      <div class="p-1.5 bg-slate-100 rounded-md border border-slate-200 text-[#0067b8]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
      </div>
      <h1 class="text-base font-semibold text-slate-900 tracking-tight">ePub Editor</h1>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 mt-8">
    <!-- Area de Carga (Dropzone) -->
    <section id="dropzone" class="border border-dashed border-slate-300 hover:border-[#0067b8] bg-white hover:bg-slate-50 transition-all duration-200 rounded-xl p-10 text-center cursor-pointer shadow-sm mb-8 group">
      <input type="file" id="file-input" accept=".epub" class="hidden">
      <div class="flex flex-col items-center justify-center space-y-3">
        <div class="p-3 bg-slate-100 rounded-full group-hover:scale-105 group-hover:bg-blue-50 transition-all text-[#0067b8]">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
        </div>
        <p class="text-base font-semibold text-slate-800">Arrastra tu libro ePub aquí o <span class="text-[#0067b8] underline font-medium">haz clic para buscar</span></p>
        <p class="text-xs text-slate-500">Compatible con archivos ePub 2 y ePub 3</p>
      </div>
    </section>

    <!-- Vista de Edición -->
    <div id="editor-view" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
      
      <!-- LADO IZQUIERDO: Metadatos -->
      <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6">
        <div class="flex items-center justify-between border-b border-slate-200 pb-4 flex-wrap gap-3">
          <h2 class="text-base font-semibold text-slate-900 flex items-center gap-2">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            Tu ePub
          </h2>
          <div class="flex gap-2">
            <button id="btn-preview" onclick="openPreview()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 px-3.5 py-1.5 rounded-md font-semibold text-xs transition-colors flex items-center gap-1.5 shadow-sm">
              <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
              </svg>
              Ojear Texto
            </button>
            <button id="btn-download" onclick="downloadEpub()" class="hidden bg-[#0067b8] hover:bg-[#005da6] text-white px-4 py-1.5 rounded-md font-semibold text-xs transition-colors flex items-center gap-1.5 shadow-sm">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
              </svg>
              Guardar
            </button>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-6 items-center sm:items-start">
          <div id="current-cover-container" class="w-36 h-52 bg-slate-100 border border-slate-300 rounded-lg overflow-hidden flex-shrink-0 shadow-inner flex items-center justify-center text-xs text-slate-400 font-medium">
            <img id="current-cover" class="w-full h-full object-cover hidden" alt="Portada Actual">
            <span id="no-cover-text">Sin Portada</span>
          </div>
          <div class="w-full space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Título</label>
              <input type="text" id="input-title" class="w-full bg-white border border-slate-300 rounded-md px-3 py-1.5 text-xs text-slate-800 focus:border-[#0067b8] focus:ring-1 focus:ring-[#0067b8] focus:outline-none transition-all">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Autor(es)</label>
              <input type="text" id="input-author" class="w-full bg-white border border-slate-300 rounded-md px-3 py-1.5 text-xs text-slate-800 focus:border-[#0067b8] focus:ring-1 focus:ring-[#0067b8] focus:outline-none transition-all">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Editorial</label>
                <input type="text" id="input-publisher" class="w-full bg-white border border-slate-300 rounded-md px-3 py-1.5 text-xs text-slate-800 focus:border-[#0067b8] focus:ring-1 focus:ring-[#0067b8] focus:outline-none transition-all">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Idioma</label>
                <input type="text" id="input-language" class="w-full bg-white border border-slate-300 rounded-md px-3 py-1.5 text-xs text-slate-800 focus:border-[#0067b8] focus:ring-1 focus:ring-[#0067b8] focus:outline-none transition-all">
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">ISBN</label>
              <input type="text" id="input-isbn" class="w-full bg-white border border-slate-300 rounded-md px-3 py-1.5 text-xs text-slate-800 font-mono focus:border-[#0067b8] focus:ring-1 focus:ring-[#0067b8] focus:outline-none transition-all">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Sinopsis / Descripción</label>
          <textarea id="input-description" rows="5" class="w-full bg-white border border-slate-300 rounded-md p-3 text-xs text-slate-800 focus:border-[#0067b8] focus:ring-1 focus:ring-[#0067b8] focus:outline-none transition-all leading-relaxed"></textarea>
        </div>
      </div>

      <!-- LADO DERECHO: Búsqueda Oficial -->
      <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6 flex flex-col">
        <div class="flex items-center justify-between border-b border-slate-200 pb-4">
          <h2 class="text-base font-semibold text-slate-900 flex items-center gap-2">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
            </svg>
            Búsqueda Oficial
          </h2>
          <button onclick="reSearchGoogle()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 px-3 py-1.5 rounded-md font-semibold transition-colors flex items-center gap-1">
            <svg class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            Re-buscar
          </button>
        </div>

        <div id="suggested-loading" class="hidden text-center py-12 space-y-3">
          <div class="animate-spin rounded-full h-7 w-7 border-b-2 border-[#0067b8] mx-auto"></div>
          <p class="text-xs text-slate-500 font-medium">Buscando ediciones...</p>
        </div>

        <div id="suggested-content" class="hidden space-y-4"></div>

        <div id="suggested-empty" class="text-center py-12 text-slate-400 text-xs">
          Carga un archivo ePub para buscar información oficial.
        </div>
      </div>
    </div>
  </main>

  <!-- MODAL DE VISTA PREVIA -->
  <div id="preview-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 sm:p-8 opacity-0 transition-opacity duration-200">
    <div class="bg-white border border-slate-200 rounded-xl shadow-2xl w-full max-w-4xl h-full max-h-[85vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="preview-modal-content">
      <div class="px-6 py-3.5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
        <h3 class="font-semibold text-sm text-slate-900 flex items-center gap-2">
          <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          Inspección de Texto (Primeros capítulos)
        </h3>
        <button onclick="closePreview()" class="text-slate-400 hover:text-slate-700 bg-white border border-slate-200 rounded-md p-1 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-6 overflow-y-auto flex-grow bg-white">
        <div id="preview-text" class="text-slate-700 text-sm leading-relaxed font-serif max-w-2xl mx-auto space-y-4">
          Cargando texto...
        </div>
      </div>
    </div>
  </div>


  <script src="app.js"></script>
</body>
</html>
